# Build the Docker image, push it to GHCR and deploy it to the production VPS.
#
# Required secrets (see docs/deployment.md):
#   repository:              VITE_GOOGLE_API_KEY, VITE_GOOGLE_CLIENT_ID,
#                            VITE_GOOGLE_APP_ID, VITE_GOOGLE_CLIENT_SECRET (all optional)
#   environment "production": DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS

name: Build and deploy

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/m5-chronist
  DEPLOY_DIR: /opt/m5-chronist

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_GOOGLE_API_KEY=${{ secrets.VITE_GOOGLE_API_KEY }}
            VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}
            VITE_GOOGLE_APP_ID=${{ secrets.VITE_GOOGLE_APP_ID }}
            VITE_GOOGLE_CLIENT_SECRET=${{ secrets.VITE_GOOGLE_CLIENT_SECRET }}

      # Deploy by digest, so the server runs exactly the image built here.
      - id: ref
        run: |
          name="$(echo "${REGISTRY}/${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"
          echo "image=${name}@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://www.chronist.eu
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: deploy

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host prod
            HostName ${{ secrets.DEPLOY_HOST }}
            User ${{ secrets.DEPLOY_USER }}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF

      - name: Upload compose files
        run: scp deploy/compose.yaml deploy/Caddyfile "prod:${DEPLOY_DIR}/"

      - name: Pull and restart
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The job token is only valid while this job runs; log out afterwards.
          printf '%s' "$GHCR_TOKEN" | ssh prod "docker login ${REGISTRY} -u '${GHCR_USER}' --password-stdin"
          ssh prod "set -e
            cd '${DEPLOY_DIR}'
            printf 'M5_IMAGE=%s\n' '${IMAGE}' > .env
            docker compose pull
            docker compose up -d --remove-orphans
            docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile
            docker logout ${REGISTRY}
            docker image prune -f"

      - name: Smoke test
        run: curl --fail --silent --show-error --retry 10 --retry-delay 6 --retry-all-errors -o /dev/null https://www.chronist.eu/

      - name: Clean up
        if: always()
        run: |
          ssh prod "docker logout ${REGISTRY}" || true
          rm -f ~/.ssh/deploy_key
