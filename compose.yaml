# M5 - Chronist — static PWA served by nginx.
#
#   docker compose up -d --build
#
# Variables are read from the shell or from .env next to this file.
# The VITE_GOOGLE_* values are optional; without them the Drive buttons stay hidden.

name: m5-chronist

services:
  m5-chronist:
    image: m5-chronist:latest
    build:
      context: .
      args:
        VITE_GOOGLE_API_KEY: ${VITE_GOOGLE_API_KEY:-}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_GOOGLE_APP_ID: ${VITE_GOOGLE_APP_ID:-}
        VITE_GOOGLE_CLIENT_SECRET: ${VITE_GOOGLE_CLIENT_SECRET:-}
        VITE_APP_VERSION: ${VITE_APP_VERSION:-}
        VITE_PWA_NAME: ${VITE_PWA_NAME:-}
    ports:
      - "${M5_PORT:-8080}:80"
    restart: unless-stopped
