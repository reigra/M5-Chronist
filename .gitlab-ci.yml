stages:
  - test
  - secret-detection
  - deploy
  - release
  - merge

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

variables:
  SECRET_DETECTION_ENABLED: 'true'
  # .npmrc setzt git-tag-version=false → in CI überschreiben
  NPM_CONFIG_GIT_TAG_VERSION: 'true'

sast:
  stage: test

secret_detection:
  stage: secret-detection

pages:
  stage: deploy
  image: node:20
  variables:
    VITE_GOOGLE_API_KEY: $VITE_GOOGLE_API_KEY
    VITE_GOOGLE_CLIENT_ID: $VITE_GOOGLE_CLIENT_ID
    VITE_GOOGLE_APP_ID: $VITE_GOOGLE_APP_ID
  script:
    # Dependencies installieren (vor Version-Bump, damit lockfile stabil)
    - 'npm ci'

    # Git-Identität
    - 'git config user.email "ci-bot@gitlab.com"'
    - 'git config user.name "GitLab CI Bot"'

    # Version bump (nur Dateien, noch kein Commit/Tag)
    - 'npm version patch --no-git-tag-version'

    # Neue Version auslesen
    - 'NEW_VERSION=$(node -p "require(''./package.json'').version")'

    # Changelog mit Versionsheader aktualisieren
    - |
      node -e "
        const fs = require('fs');
        const version = '$NEW_VERSION';
        const date = new Date().toISOString().slice(0, 10);
        const header = '## [v' + version + '] - ' + date + '\n\n';
        const content = fs.readFileSync('CHANGELOG.md', 'utf8');
        fs.writeFileSync('CHANGELOG.md', header + content);
      "

    # Alles in einem Commit + Tag
    - 'git add -A'
    - 'git commit -m "chore: release v$NEW_VERSION [skip ci]"'
    - 'git tag "v$NEW_VERSION"'

    # Version-Commit + Tag nach release pushen
    - 'git remote set-url origin "https://oauth2:${CI_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"'
    - 'git push origin HEAD:release --tags'

    # App bauen
    - 'npm run build'
    - 'rm -rf public'
    - 'mv dist public'

    # Variablen für nachfolgende Jobs exportieren
    - 'NEW_VERSION=$(node -p "require(''./package.json'').version")'
    - 'echo "NEW_VERSION=$NEW_VERSION" >> build.env'
    - 'echo "TAG_NAME=v$NEW_VERSION" >> build.env'
    - 'echo "PAGES_JOB_ID=$CI_JOB_ID" >> build.env'

    # ZIP-Archiv für Release-Asset erstellen
    - 'apt-get update && apt-get install -y zip --no-install-recommends && rm -rf /var/lib/apt/lists/*'
    - 'cd tools && zip -r ../Magus-Release.zip .'
  artifacts:
    paths:
      - public
      - Magus-Release.zip
    reports:
      dotenv: build.env
  only:
    - release

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  script:
    - |
      awk '/^## [[]v/ { if (f) exit; f = 1; next } f' CHANGELOG.md > changelog-notes.txt
    - cat changelog-notes.txt
    - test -s changelog-notes.txt || echo "WARN: changelog-notes.txt ist leer"
    - 'release-cli create
        --name "Release $NEW_VERSION"
        --tag-name "$TAG_NAME"
        --ref "$TAG_NAME"
        --description changelog-notes.txt
        --assets-link "{\"name\":\"Magus-Release.zip\",\"url\":\"${CI_PROJECT_URL}/-/jobs/${PAGES_JOB_ID}/artifacts/raw/Magus-Release.zip\"}"'
  needs:
    - pages
  only:
    - release

merge-back:
  stage: merge
  image: node:20
  script:
    - 'git config user.email "ci-bot@gitlab.com"'
    - 'git config user.name "GitLab CI Bot"'
    - 'git remote set-url origin "https://oauth2:${CI_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"'
    - 'git fetch origin release'
    - 'git push origin origin/release:master'
  needs:
    - release
  only:
    - release