server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    types {
        application/manifest+json webmanifest;
    }

    # Hashed build assets: cache forever
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Service worker, manifest and entry HTML must always be revalidated,
    # otherwise PWA update detection breaks.
    location ~* ^/(sw\.js|workbox-.*\.js|registerSW\.js|manifest\.webmanifest|index\.html)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA fallback for vue-router history mode
    location / {
        try_files $uri $uri/ /index.html;
    }
}
